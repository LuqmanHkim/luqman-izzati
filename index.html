<!--
════════════════════════════════════════════════════════════════════
GOOGLE SHEETS · KOD GOOGLE APPS SCRIPT LENGKAP
════════════════════════════════════════════════════════════════════
5 LANGKAH MUDAH:
1. Cipta Google Sheet kosong. Pilih Extensions → Apps Script.
2. Padam kod sedia ada, tampal semua kod di bawah, kemudian Save.
3. Pilih Deploy → New deployment → jenis Web app.
4. Tetapkan Execute as: Me, Who has access: Anyone. Klik Deploy dan
   benarkan akses. Hanya kongsi pautan jemputan, bukan helaian peribadi.
5. Salin URL /exec ke CONFIG.sheetWebhookUrl. Buka jemputan, cuba RSVP,
   kemudian semak baris dalam Sheet. Apabila mengubah kod Apps Script,
   pilih Deploy → Manage deployments → Edit → New version → Deploy.

Nota: POST no-cors tidak boleh membaca respons. Mesej berjaya bermaksud
permintaan dihantar, bukan bukti baris telah disimpan. Semak Sheet.
doGet mendedahkan nama dan ucapan sahaja; elakkan ucapan peribadi.
ID membolehkan RSVP pada peranti yang sama dikemas kini tanpa pendua.

const TAB_NAME = 'RSVP';
const HEADERS = ['id', 'name', 'attendance', 'guests', 'wish', 'timestamp'];

function getSheet_() {
  const book = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = book.getSheetByName(TAB_NAME);
  if (!sheet) sheet = book.insertSheet(TAB_NAME);
  if (sheet.getLastRow() === 0) sheet.appendRow(HEADERS);
  return sheet;
}
function json_(data) {
  return ContentService.createTextOutput(JSON.stringify(data))
    .setMimeType(ContentService.MimeType.JSON);
}
// A leading apostrophe keeps user strings literal in Google Sheets.
function literal_(value, max) {
  const text = String(value || '').trim().slice(0, max);
  return /^[=+\-@]/.test(text) ? "'" + text : text;
}
function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    const d = JSON.parse(e.postData.contents);
    if (!d.name || !['Hadir','Tidak Hadir'].includes(d.attendance)) {
      return json_({ok:false, error:'Maklumat tidak lengkap'});
    }
    const sheet = getSheet_();
    const id = String(d.id || Utilities.getUuid()).slice(0,100);
    const guests = d.attendance === 'Hadir' ? Math.max(1, Math.min(10, Number(d.guests) || 1)) : 0;
    const row = [literal_(id,100), literal_(d.name,100), d.attendance,
      guests, literal_(d.wish,800), new Date().toISOString()];
    const values = sheet.getDataRange().getValues();
    const existing = values.findIndex((r,i) => i > 0 && String(r[0]) === id);
    if (existing > 0) sheet.getRange(existing + 1, 1, 1, HEADERS.length).setValues([row]);
    else sheet.appendRow(row);
    return json_({ok:true});
  } catch (error) {
    return json_({ok:false, error:'Permintaan tidak sah'});
  } finally { lock.releaseLock(); }
}
function doGet() {
  const sheet = getSheet_();
  const rows = sheet.getDataRange().getValues().slice(1);
  const wishes = rows.filter(r => String(r[4]).trim()).map(r => ({
    id:String(r[0]), name:String(r[1]), wish:String(r[4]),
    timestamp:r[5] instanceof Date ? r[5].toISOString() : String(r[5])
  })).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  return json_(wishes);
}
